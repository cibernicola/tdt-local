name: Release

# Builds the installers for Windows, macOS (Intel and Apple Silicon) and Linux.
# Push a tag such as v1.0.0 to publish them in a GitHub release, or run it by hand to get the files as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS Intel, os: macos-15-intel }
          - { name: macOS Apple Silicon, os: macos-latest }
          # the oldest supported Ubuntu keeps the glibc requirement of the .deb low
          - { name: Linux x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from tdtlocal import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + __version__:
              sys.exit(f"el tag {tag} no coincide con la versión {__version__}")
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tools
        run: python -m pip install pyinstaller certifi
      - name: Build the installers
        env:
          TDT_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: python packaging/build.py
      # The packaged app has no debug port, so it is checked from outside: it starts, serves the page, hands over a second
      # launch and stops when asked. Linux needs a display (xvfb).
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        shell: bash
        run: python packaging/smoke.py "$(ls -d dist/electron/*/)"
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a python packaging/smoke.py "$(ls -d dist/electron/*/)"
      # The .deb itself: its dependencies install and Chromium's sandbox helper is setuid, as the package says
      - name: Smoke test the .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/installers/*.deb
          test -u /opt/tdt-local/chrome-sandbox
          xvfb-run -a python packaging/smoke.py /opt/tdt-local
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/installers/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: installers
    # Also when one platform failed: what was built is published, and the notes say what is missing (nothing is published if nothing was built)
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Combine the checksums
        run: |
          cd installers
          cat SHA256SUMS-*.txt | sort -k2 -u > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
      # The notes are the section of the CHANGELOG of this version, plus what could not be built (if anything)
      - name: Write the notes
        shell: python
        run: |
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[)", changelog, re.S | re.M)
          notes = (found.group(1).strip() if found else "Ver el CHANGELOG.") + "\n"
          names = [p.name for p in pathlib.Path("installers").iterdir()]
          wanted = {
              "Windows": "windows",
              "macOS (Intel)": "macos-x64",
              "macOS (Apple Silicon)": "macos-arm64",
              "Linux": "linux",
          }
          missing = [label for label, key in wanted.items() if not any(key in name for name in names)]
          if missing:
              notes += (
                  "\n---\n**No se ha podido construir el instalador de: " + ", ".join(missing) + ".** "
                  "Esta versión se publica sin él; si es tu sistema, abre una *issue* con lo que veas.\n"
              )
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "TDT local ${GITHUB_REF_NAME#v}" --notes-file notes.md
