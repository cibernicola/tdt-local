[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tdt-local"
description = "TDT local (Tune · Display · Tinker): visor web local para las listas de TDTChannels: televisión y radio de España, guía, multivisión, subtítulos y asistente con IA local"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = []  # standard library only
keywords = ["tdt", "iptv", "hls", "radio", "spain", "epg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Natural Language :: Spanish",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "mypy"]

[project.scripts]
tdt-local = "tdtlocal.cli:main"

[project.gui-scripts]
tdt-local-app = "tdtlocal.desktop:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "tdtlocal.__version__" }

[tool.setuptools.packages.find]
include = ["tdtlocal*"]

[tool.setuptools.package-data]
tdtlocal = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["tdtlocal/static/vendor", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "A", "T20", "PIE", "RET", "PTH"]
ignore = [
    "S310",   # urlopen with a variable URL: validated by tdtlocal.net before use
    "S603",   # subprocess with fixed arguments (ffmpeg, whisper-server)
    "S607",   # executables are resolved with shutil.which
    "RET505", # "else after return" is often clearer in the router
    "RUF001", # the UI is Spanish; ambiguous-unicode warnings do not apply
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "A002"]
"scripts/**" = ["T201"]  # command-line tools print
"packaging/**" = ["T201", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["tdtlocal"]

[tool.mypy]
python_version = "3.9"
files = ["tdtlocal"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
